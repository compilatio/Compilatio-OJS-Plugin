stages:
  - phpstan
  - test
  - mirror

phpstan:
  stage: phpstan
  image: php:8.2-cli-alpine
  variables:
    OJS_VERSION: "3.5.0-4"
    OJS_ROOT: "/tmp/ojs"
  before_script:
    - apk add --no-cache curl git unzip libxml2-dev oniguruma-dev curl-dev icu-dev libzip-dev freetype-dev libjpeg-turbo-dev libpng-dev
    - docker-php-ext-configure gd --with-freetype --with-jpeg
    - docker-php-ext-install bcmath curl dom ftp gd intl mbstring xml xmlwriter zip
    - curl -fsSL https://getcomposer.org/installer -o /tmp/composer-setup.php
    - php /tmp/composer-setup.php --install-dir=/usr/local/bin --filename=composer
    - mkdir -p "$OJS_ROOT"
    - curl -fsSL --retry 3 "https://pkp.sfu.ca/ojs/download/ojs-${OJS_VERSION}.tar.gz" -o /tmp/ojs.tar.gz
    - tar -xzf /tmp/ojs.tar.gz --strip-components=1 -C "$OJS_ROOT"
    - test -f "$OJS_ROOT/lib/pkp/lib/vendor/autoload.php"
  script:
    - composer install --no-interaction --prefer-dist
    - composer analyse
  rules:
    - if: '"push" == $CI_PIPELINE_SOURCE || "merge_request_event" == $CI_PIPELINE_SOURCE'

unit_tests:
  stage: test
  image: php:8.2-cli-alpine
  before_script:
    - apk add --no-cache curl git unzip libxml2-dev oniguruma-dev
    - docker-php-ext-install dom mbstring xml xmlwriter
    - curl -fsSL https://getcomposer.org/installer -o /tmp/composer-setup.php
    - php /tmp/composer-setup.php --install-dir=/usr/local/bin --filename=composer
  script:
    - composer install --no-interaction --prefer-dist
    - composer test
  rules:
    - if: '"push" == $CI_PIPELINE_SOURCE || "merge_request_event" == $CI_PIPELINE_SOURCE'

.github_mirror:
  stage: mirror
  image: alpine:3.22
  variables:
    GIT_DEPTH: "0"
  before_script:
    - apk add --no-cache git ca-certificates python3
  script:
    - sh ci/mirror-to-github.sh
  rules:
    - if: '"push" == $CI_PIPELINE_SOURCE && "main" == $CI_COMMIT_BRANCH'

mirror_compilatio:
  extends: .github_mirror
  resource_group: github-mirror-compilatio
  variables:
    PLUGIN_PRODUCT: compilatio
    GITHUB_REPOSITORY: https://github.com/Kyoo-Compi/Compilatio-OJS-Plugin.git

mirror_letimio:
  extends: .github_mirror
  resource_group: github-mirror-letimio
  variables:
    PLUGIN_PRODUCT: letimio
    GITHUB_REPOSITORY: https://github.com/Kyoo-Compi/Letimio-OJS-Plugin.git
