name: Package OJS plugin

on:
  push:
    tags:
      - '**'

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Check out tagged sources and compiled assets
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Test packaging
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python3 -m unittest discover -s ci/test -p 'test_*.py'

      - name: Create installation archive and checksums
        run: python3 ci/package-plugin.py . dist

      - name: Upload installation archive and checksums
        uses: actions/upload-artifact@v4
        with:
          name: ojs-plugin-package
          path: |
            dist/*.tar.gz
            dist/*.md5
            dist/*.sha256
          if-no-files-found: error
          retention-days: 90
