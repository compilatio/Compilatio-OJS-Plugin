stages:
  - mirror

.github_mirror:
  stage: mirror
  image: alpine:3.22
  variables:
    GIT_DEPTH: "0"
  before_script:
    - apk add --no-cache git ca-certificates
  script:
    - sh ci/mirror-to-github.sh
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "main"'

mirror_compilatio:
  extends: .github_mirror
  resource_group: github-mirror-compilatio
  variables:
    GITHUB_REPOSITORY: https://github.com/compilatio/Compilatio-OJS-Plugin.git

mirror_letimio:
  extends: .github_mirror
  resource_group: github-mirror-letimio
  variables:
    GITHUB_REPOSITORY: https://github.com/compilatio/Letimio-OJS-Plugin.git
